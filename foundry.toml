[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Gas-lean mainnet deploy matters: user balance is ~0.00092 BNB at ~0.05 gwei,
# so deployment must stay well under ~2M gas. Optimizer is on for this reason.

[rpc_endpoints]
bsc = "https://bsc-dataseed1.bnbchain.org"
bsc_testnet = "https://bsc-testnet-dataseed.bnbchain.org"
